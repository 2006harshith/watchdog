# SP4 Step 4 feature audit. Read by scripts/sp4_feature_audit.py.
checkpoints: [2, 3, 4]            # docs/decisions.md 2026-09-29: t = 3, 4 primary, t = 2 secondary
primary_checkpoints: [3, 4]       # the matched-step mean is taken over these only

behaviour_classes: [looping, context_corruption, goal_drift, tool_cascade]
api_classes: [malformed_json, wrong_document, rate_limit, timeout]   # D4: reported separately

family_predictability:            # 4a: healthy runs only, label = family
  checkpoints: [3, 4, 5]
  n_splits: 5
  groups: [MI, MS, ENV, TEXT]
  top_k: 5
  # Same framework and tool roster on both sides, so family is not confounded with task domain
  # (docs/decisions.md, "Step 4a uses matched corpus pairs").
  matched_pairs:
    booking_qwen_vs_llama:
      qwen: [ollama7b]
      llama: [ollama_llama8b]
    research_qwen_vs_gemini:
      qwen: [real_research7b_long_drift, real_research7b_long_ext]
      gemini: [real_gemini_long]
  # Secondary: every healthy run of each family; shows how much of the matched result is domain.
  all_runs_pairs: [[qwen, llama], [qwen, gemini], [llama, gemini]]

univariate:                       # 4b: each MI feature alone, qwen only (the training family)
  family: qwen
  flag_threshold: 0.9             # flag max(AUROC, 1 - AUROC) above this

esn:                              # 4d: E1's folds, pools and ESN settings (seed 1300)
  e1_config: configs/e1.yaml

bootstrap:
  n: 10000
  seed: 0
