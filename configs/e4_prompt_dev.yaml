# SP7 Step 2: judge prompt development on qwen SOURCE runs only (no llama run is ever read here).
# Design: docs/decisions.md 2026-10-28 (SP7). Iteration rule, fixed before the first call: at most
# 3 template versions; revise only if parse failures > 2% or the output is visibly off-format; freeze
# the version with the highest qwen headline AUROC (mean t = 3, 4) among those with <= 2% failures.
family: qwen
dev_set:
  seed: 0
  healthy: 30
  per_class: 10                     # each headline class
  classes: [looping, goal_drift, context_corruption]
  min_T: 5                          # a step 4 exists, so every run is scored at t = 2, 3, 4
  max_tau: 3                        # positives count at t = 3 and 4 (tau <= t)
checkpoints: {scored: [2, 3, 4], report: [3, 4]}
judge:                              # docs/decisions.md 2026-10-28: J-local replaces the hosted judge
  name: J-local
  provider: ollama
  model: phi4-mini:3.8b             # ollama.com/library/phi4-mini, 2.5 GB, 3.8B; the digest goes into every cache key
  temperature: 0.0
  seed: 0
  num_predict: 16
  num_ctx: 4096                     # longest dev prompt is 4,245 chars; a filled context is refused, not truncated
  samples: 1                        # scoring samples per (run, t)
  determinism_subset: {prompts: 30, samples: 3, seed: 0}
price:                              # local model: no per-token price; cost is measured GPU time
  input_usd_per_mtok: 0.0
  output_usd_per_mtok: 0.0
budget_usd: 2.0                     # kept for a hosted judge; a local judge spends $0
max_parse_failure_rate: 0.02
max_versions: 3
cache: results/e4_dev_cache.jsonl
prompts_dir: configs/e4_prompts
