[project]
name = "watchdog-agent"
version = "0.0.1"
description = "Supervisor agent that estimates failure probability for partial LLM agent runs"
readme = "README.md"
authors = [
    { name = "Harshith", email = "hharshith005@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=2.0.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
