[project]
name = "watchdog-agent"
version = "0.0.1"
description = "Supervisor agent that estimates failure probability for partial LLM agent runs"
readme = "README.md"
authors = [
    { name = "Harshith", email = "hharshith005@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=2.0.0",
    "mlflow>=3.16.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
# Third-party code kept verbatim (Apache-2.0); see its __init__.py.
extend-exclude = ["src/watchdog_agent/baselines/esn/_vendor"]

[tool.pytest.ini_options]
markers = [
    "smoke: hits the live Hugging Face dataset instead of synthetic data",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "scikit-learn>=1.9.1",
]
